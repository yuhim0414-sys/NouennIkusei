<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まなび農園 6年生のぼうけん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#e3f0df; --ink:#1d2b1f; --card:#fbfdf6; --line:#b9d1b2; --muted:#3b4f3e;
  --soil:#6a4526; --soil2:#83592f; --leaf:#3f9a3a; --leaf-d:#2a6f2c; --sun:#ffc93c; --berry:#dc4630; --sky:#bfe2ee; --on-leaf:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#162018; --ink:#eef4e6; --card:#222e23; --line:#3b4d3b; --muted:#c8d6c4;
  --soil:#4d321c; --soil2:#614125; --leaf:#4fae48; --leaf-d:#7fd176; --sun:#ffc93c; --berry:#ff7a63; --sky:#24414b; --on-leaf:#0d1a0e;
}}
:root[data-theme="dark"]{
  --bg:#162018; --ink:#eef4e6; --card:#222e23; --line:#3b4d3b; --muted:#c8d6c4;
  --soil:#4d321c; --soil2:#614125; --leaf:#4fae48; --leaf-d:#7fd176; --sun:#ffc93c; --berry:#ff7a63; --sky:#24414b; --on-leaf:#0d1a0e;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-weight:700;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num,h1,h2{font-family:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:400}
.app{max-width:560px;margin:0 auto;padding:0 14px 124px}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--line)}
.hud .lv{flex:1;min-width:0}
.hud .lv b{font-size:20px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px;transition:width .3s}
.chip{background:var(--card);border:2px solid var(--ink);font-size:17px;border-radius:999px;padding:3px 11px;font-weight:700;white-space:nowrap}
.gear{font-size:22px;padding:4px}

h2{font-size:21px;margin:18px 0 8px}
p{margin:0 0 8px}
small,.muted{color:var(--muted)}small{font-size:14px}.guide{background:var(--ink);color:var(--bg);border-radius:16px;padding:13px 15px;font-weight:900;font-size:19px;line-height:1.45;margin:12px 0}

.banner{margin:12px 0;background:var(--sun);color:#3a2a00;border-radius:14px;padding:9px 13px;font-weight:700;font-size:15px}
.field{background:var(--soil);border-radius:22px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.plot{aspect-ratio:1;border-radius:14px;background:var(--soil2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:40px;line-height:1.1;color:#fff;position:relative;padding:4px}.plot b{font-size:14px;line-height:1.3;font-weight:900;text-align:center}.plot.ripe b{color:#3a2a00}
.plot.empty{border:3px dashed rgba(255,255,255,.7);font-size:30px}
.plot.ripe{background:var(--sun);animation:bob 1s ease-in-out infinite alternate}
.plot .pips{font-size:10px;letter-spacing:1px;line-height:1}
@keyframes bob{to{transform:translateY(-4px)}}
.seg{display:flex;gap:6px;margin:14px 0 8px}
.seg button{flex:1;min-width:30%;line-height:1.3;padding:11px 4px;font-size:17px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700}
.seg button.on{background:var(--leaf-d);border-color:var(--leaf-d);color:var(--bg)}
.cta{display:block;width:100%;padding:17px;border-radius:18px;background:var(--leaf-d);color:var(--bg);font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--ink)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-d)}
.btn{padding:10px 16px;border-radius:12px;background:var(--leaf-d);color:var(--bg);font-weight:900;font-size:16px}
.btn.sub{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px;margin:12px 0}
.row{display:flex;align-items:center;gap:11px}
.row .grow{flex:1;min-width:0}
.row .em{font-size:32px;width:42px;text-align:center;flex:none}
.list>.row{padding:11px 0;border-bottom:2px dotted var(--line)}
.list>.row:last-child{border:0}
.stock{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stock span{background:var(--bg);border-radius:10px;padding:3px 9px;font-weight:700}

/* map: the route the child drew, as stations on one line */
.route{position:relative;margin:14px 0 0;padding-left:34px}
.route::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;width:6px;border-radius:6px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 16px)}
.stop{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.stop::before{content:"";position:absolute;left:-30px;top:20px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:5px solid var(--line)}
.stop.open::before{border-color:var(--leaf);background:var(--sun)}
.stop.lock{background:transparent;border-style:dashed}
.stop h3{margin:0;font-size:18px;font-weight:900}
.stop .need{font-family:"Dela Gothic One",sans-serif;font-size:15px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;font-size:14px;font-weight:700;line-height:1.3}
.cell .em{font-size:34px;display:block}
.cell.no{opacity:.6}
.r3{border-color:var(--sun)} .r4{border-color:var(--berry)}
.tag{font-family:"Dela Gothic One",sans-serif;font-size:12px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;margin:5px 3px;padding:5px 0;border-radius:12px;font-size:13px;font-weight:900;color:var(--ink)}
nav button span{display:block;font-size:25px;line-height:1.2}
nav button.on{background:var(--leaf-d);color:var(--bg)}

.over{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.over .in{max-width:560px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.qtop button{font-size:15px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px 14px;margin:14px 0;text-align:center}
.qcard p{font-size:27px;font-weight:700;margin:6px 0 0;line-height:1.9}
.qcard u{text-decoration-thickness:3px;text-decoration-color:var(--berry);text-underline-offset:5px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{min-height:84px;padding:8px;border-radius:16px;background:var(--card);border:3px solid var(--ink);font-size:25px;font-weight:700}
.opts button.ok{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.opts button.ng{background:var(--berry);border-color:var(--berry);color:#fff}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.2;margin:0 .15em}
.fr i{font-style:normal;padding:0 .3em}
.fr i:first-child{border-bottom:2px solid currentColor}
#fb{margin-top:14px;text-align:center;font-weight:700}
#fb .gain{font-size:20px}
#fb .btn{margin-top:10px;font-size:17px;padding:11px 26px}
.foe{display:flex;gap:12px;align-items:center;margin-top:10px}
.foe .big{font-size:54px;line-height:1}
.tbar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;width:100%;background:var(--berry)}
.center{text-align:center}
.huge{font-size:76px;line-height:1.2}

#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:82%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h2{margin-top:0}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;font-size:16px;max-width:92%}
input[type=number]{font:inherit;width:96px;padding:7px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.pickg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pickg button{min-height:58px;padding:8px 6px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);font-weight:900;font-size:16px;line-height:1.3}.pickg button.on{background:var(--leaf-d);color:var(--bg)}.pickg button small{font-size:12px;color:inherit;opacity:.85}
.fig{width:min(250px,84%);height:auto;stroke:currentColor;stroke-width:2.5;fill:var(--sky);stroke-linejoin:round;vertical-align:middle}
.fig text{fill:currentColor;stroke:none;font-size:16px;font-weight:900;font-family:inherit}.fig .n{fill:none}.fig .d{fill:none;stroke-dasharray:5 4;stroke-width:1.8}
.tools{display:flex;gap:8px;margin-top:14px}.tools button{flex:1;padding:11px 4px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-weight:900}.tools button.on{background:var(--leaf-d);color:var(--bg)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.calc .cd{grid-column:1/-1;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;text-align:right;font-size:27px;min-height:58px;overflow-x:auto;white-space:nowrap}
.calc button{padding:12px 0;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:22px;font-weight:900}
.calc button:nth-last-child(-n+2){grid-column:span 2;font-size:16px}
.memo{margin-top:10px;text-align:right}#mc{width:100%;height:240px;background:var(--card);border:3px dashed var(--ink);border-radius:14px;touch-action:none;display:block;margin-bottom:6px}
.opts.long{grid-template-columns:1fr}.opts.long button{font-size:19px;min-height:58px}
details{border:2px solid var(--line);border-radius:14px;margin-top:8px;padding:0 10px}details[open]{padding-bottom:10px}
summary{font-weight:900;font-size:18px;padding:12px 2px;cursor:pointer}
.pickg button:disabled{opacity:.45}
.sws{display:flex;gap:9px;flex-wrap:wrap}.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line)}.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.scene{position:relative;height:150px;border-radius:22px 22px 0 0;overflow:hidden;margin-top:6px}
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.avatar{position:absolute;right:14px;bottom:0;padding:0;line-height:0}
.avatar span{position:absolute;left:-34px;top:8px;background:#fffdf3;color:#2b2a1f;border:2px solid #2b2a1f;border-radius:999px;font-size:12px;line-height:1.6;padding:0 8px;font-weight:900}
.field{margin-top:0;border-radius:0 0 22px 22px;background:linear-gradient(#5fae4e,#468c3b);border-top:5px solid #3d7a33}
.plot{border-radius:10px;background:repeating-linear-gradient(0deg,#6a4323 0 9px,#7c5230 9px 18px);box-shadow:inset 0 4px 9px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.18)}
.plot b{text-shadow:0 1px 2px rgba(0,0,0,.8)}
.plot.empty{background:repeating-linear-gradient(0deg,#75502e 0 9px,#86603a 9px 18px)}
.plot.ripe{background:repeating-linear-gradient(0deg,#6a4323 0 9px,#7c5230 9px 18px);box-shadow:0 0 0 4px var(--sun),inset 0 4px 9px rgba(0,0,0,.5)}
.plot.ripe b{color:#ffe27a}
.rp{filter:drop-shadow(0 4px 2px rgba(0,0,0,.45))}
.basket{position:absolute;left:46%;bottom:4px;font-size:42px;line-height:1}
.basket b{position:absolute;right:-12px;top:-6px;background:#dc4630;color:#fff;border-radius:999px;font-size:14px;min-width:26px;text-align:center;padding:0 5px;line-height:1.7}
.exp{display:block;text-align:left;background:var(--card);border:3px solid var(--sun);border-radius:14px;padding:10px 13px;margin:8px 0 2px;font-size:17px;line-height:1.7}.exp b{color:var(--leaf-d)}
.wbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.wbar div{background:var(--card);border:2px solid var(--line);border-radius:12px;text-align:center;padding:5px 2px;line-height:1.25}
.wbar span{font-size:20px}.wbar small{display:block;font-size:12px;color:var(--ink)}.wbar b{font-size:21px}
.wbar .rec{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.tagr{background:var(--sun);color:#3a2a00;border-radius:999px;font-size:13px;padding:1px 9px;margin-left:4px;white-space:nowrap}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:shake .4s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--leaf)}100%{box-shadow:0 0 0 26px transparent}}
.qcard.good{animation:flash .6s;border-color:var(--leaf)}
@keyframes danger{50%{box-shadow:inset 0 0 0 10px var(--berry)}}
.over.danger{box-shadow:inset 0 0 0 5px var(--berry);animation:danger 1s infinite}
nav button.navc{flex:none;width:84px;height:84px;margin:-24px 2px 4px;border-radius:50%;background:var(--leaf-d);color:var(--bg);border:5px solid var(--card);font-size:12px;box-shadow:0 4px 0 var(--ink)}
nav button.navc span{font-size:30px}
nav button.navc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
nav div{align-items:flex-end}
.hud{gap:6px!important}.chip{padding:3px 8px!important}.gear{padding:2px!important}
@media (prefers-reduced-motion:reduce){.pop,.shake,.qcard.good,.over.danger{animation:none}.plot.ripe{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="lv"><b class="num">レベル <span id="lv"></span></b> <small id="xpt"></small><div class="bar"><i id="xpb"></i></div></div>
    <span class="chip">🪙 <span id="mo"></span></span>
    <span class="chip">🎟️ <span id="tk"></span></span>
    <button class="gear" data-a="mute" id="mu" aria-label="音のオンオフ"></button>
    <button class="gear" data-a="settings" aria-label="せってい">⚙️</button>
  </header>
  <main id="view"></main>
</div>
<nav><div id="tabs"></div></nav>
<div id="quiz" class="over" hidden><div class="in"><div class="qtop"><span id="qlabel"></span><button data-a="closeQuiz">やめる</button></div><div id="qbody"></div></div></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>

<script>
/* ===== 調整用の数値（ここを変えるとバランスが変わります） ===== */
const AREAS=[
 {id:'farm',lv:1,e:'🌾',n:'農園',d:'作物を育てて売ろう。'},
 {id:'cave',act:'dig',lv:30,cost:5000,e:'⛏️',n:'洞窟',d:'1問正解するたびに1mほり進む。深いほど報酬がふえ、10mごとに宝箱が出る。'},
 {id:'river',act:'fish',lv:50,cost:10000,e:'🏞️',n:'川',d:'問題に正解して川の魚をつろう。つりざおが必要。'},
 {id:'forest',act:'find',lv:100,cost:30000,e:'🌲',n:'森',d:'めずらしい虫や動物をさがそう。きのこも育てられる。'},
 {id:'rail',lv:150,cost:80000,e:'🚂',n:'鉄道',d:'遠くの町へ出荷できる。売るねだんが1.5倍。'},
 {id:'ship',lv:300,cost:250000,e:'🚢',n:'船',d:'海の向こうへ出荷できる。売るねだんが2倍。'},
 {id:'sea',act:'fish',lv:500,cost:700000,e:'🌊',n:'海',d:'海の大物をつろう。'},
 {id:'plane',lv:600,cost:2000000,e:'✈️',n:'ひこうき',d:'世界中へ出荷できる。売るねだんが3倍。'}
];
const MAXLV=1000;
const isOpen=a=>a.id==='farm'||!!S.open[a.id];
const need=l=>35+l;
// 作物: id, 絵, 名前, たねのねだん, 必要な水やり回数, 売るねだん, XP, 必要レベル, 季節
const CROPS=[
 ['carrot','🥕','にんじん',20,3,50,8,1],['potato','🥔','じゃがいも',40,4,100,12,3],['tomato','🍅','トマト',80,5,190,18,8],
 ['corn','🌽','とうもろこし',150,6,350,25,15],['nasu','🍆','なす',250,7,580,35,25],['ichigo','🍓','いちご',400,8,950,50,40],
 ['kinoko','🍄','きのこ',700,8,1700,80,100],['budou','🍇','ぶどう',1200,9,3000,120,150],['pine','🍍','パイナップル',3000,10,8000,250,300],
 ['melon','🍈','メロン',6000,10,17000,400,500],['mango','🥭','マンゴー',12000,12,36000,700,600],
 ['tulip','🌷','チューリップ',60,4,220,25,1,'spr'],['suika','🍉','すいか',60,4,220,25,1,'sum'],['pumpkin','🎃','かぼちゃ',60,4,220,25,1,'aut'],['mikan','🍊','みかん',60,4,220,25,1,'win']
].map(c=>({id:c[0],e:c[1],n:c[2],cost:c[3],w:c[4],sell:Math.round(c[5]*.7/5)*5,xp:c[6],lv:c[7],sea:c[8]}));
const CROP=Object.fromEntries(CROPS.map(c=>[c.id,c]));
// 教科ごとの水と、作物が必要とする水の組み合わせ（合計は「必要な水やり回数」と同じにする）
const TYPES=['math','kanji','sci','soc'],TI={math:'🔢',kanji:'✍️',sci:'🔬',soc:'🌏'};
const RCP={carrot:[2,1,0,0],potato:[2,2,0,0],tomato:[2,1,2,0],corn:[2,2,0,2],nasu:[2,2,2,1],ichigo:[2,2,2,2],kinoko:[2,2,4,0],budou:[3,2,0,4],pine:[3,3,2,2],melon:[1,1,4,4],mango:[3,3,3,3],tulip:[1,1,1,1],suika:[1,1,1,1],pumpkin:[1,1,1,1],mikan:[1,1,1,1]};
const rcp=id=>Object.fromEntries(TYPES.map((t,i)=>[t,RCP[id][i]]));
const needOf=p=>{const q=rcp(p.id),g=p.g||{};TYPES.forEach(t=>q[t]=Math.max(0,q[t]-(g[t]||0)));return q};
const needTxt=q=>TYPES.filter(t=>q[t]>0).map(t=>TI[t]+q[t]).join(' ');
// 生きもの・キャラ: id, 絵, 名前, レア度(1〜4), 出る場所
const CRE=[

function mk(s,q,a,w,ex){
  const set=[];w.forEach(x=>{x=String(x);if(x!==a&&!set.includes(x))set.push(x)});
  let guard=0;
  while(set.length<3&&guard++<40){const x=a.replace(/[\d.]+/,m=>num(+m+R(1,9)));if(x!==a&&!set.includes(x))set.push(x)}
  return {s,q,a,c:shuffle([a,...shuffle(set).slice(0,3)]),ex};
}

function addXp(b){const g=Math.round(b*(1+S.lv/100));S.xp+=g;const o=S.lv;

function roll(pool,luck){const w=[0,55,30,12,3];if(luck){w[3]*=2;w[4]*=2}
  const rs=[1,2,3,4].filter(r=>pool.some(c=>c.r===r));let t=rs.reduce((a,r)=>a+w[r],0),x=Math.random()*t,r=rs[0];
  for(const k of rs){if(x<w[k]){r=k;break}x-=w[k]}
  return pick(pool.filter(c=>c.r===r))}
function obtain(c){const isNew=!S.coll[c.id];S.coll[c.id]=(S.coll[c.id]||0)+1;return isNew}
function checkMs(){const t=new Date().toDateString();if(S.ms.d!==t)S.ms={d:t,l:shuffle(Object.keys(MT)).slice(0,3).map(k=>({k,p:0,c:false}))}}
function bump(k,v){checkMs();S.ms.l.forEach(m=>{if(m.k!==k||m.c)return;const g=MT[k][1],b=m.p;
  m.p=k==='combo'?Math.max(m.p,Math.min(S.combo,g)):Math.min(g,m.p+v);
  if(b<g&&m.p>=g)toast('🎯 限定ミッションたっせい！ チケットを受け取ろう')})}

/* ===== 音とエフェクト ===== */
let AC=null,master=null;const bgm={name:null,tm:null,step:0};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.mute?0:1;master.connect(AC.destination)}catch(e){AC=null;return null}}
  if(AC.state==='suspended'&&!document.hidden)AC.resume();return AC}
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
const hz=m=>440*Math.pow(2,(m-69)/12);
let NB=null,bgG=null,dly=null;
function bgInit(){if(bgG)return;bgG=AC.createGain();bgG.gain.value=.85;const cp=AC.createDynamicsCompressor();bgG.connect(cp);cp.connect(master);
  dly=AC.createDelay(1);dly.delayTime.value=.29;const fb=AC.createGain(),dg=AC.createGain();fb.gain.value=.32;dg.gain.value=.35;dly.connect(fb);fb.connect(dly);dly.connect(dg);dg.connect(bgG);
  NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.5),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function syn(f,t,d,type,v,cut,send){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;env(g,t,.008,d,v);o.connect(fl);fl.connect(g);g.connect(bgG);if(send)g.connect(dly);o.start(t);o.stop(t+d+.06)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);env(g,t,.003,.22,.55);o.connect(g);g.connect(bgG);o.start(t);o.stop(t+.3)}
function noise(t,d,v,type,fq){const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();s.buffer=NB;fl.type=type;fl.frequency.value=fq;env(g,t,.002,d,v);s.connect(fl);fl.connect(g);g.connect(bgG);s.start(t);s.stop(t+d+.05)}
// 農園: F→G→Em→Am のポップス進行、はねるリズム / 戦い: Am→F→Dm→E の4つ打ち
const SONGS={
 farm:{bpm:104,sw:.16,ch:[[53,57,60,64],[55,59,62,65],[52,55,59,62],[57,60,64,67]],bs:[41,43,40,45],
  mel:[[76,0,0,79,0,0,76,0,74,0,72,0,0,0,74,0],[76,0,0,74,0,0,71,0,74,0,0,0,0,0,67,0],[79,0,0,76,0,0,79,0,83,0,81,0,0,0,79,0],[76,0,0,72,0,0,76,0,81,0,0,0,0,79,76,0]]},
 battle:{bpm:150,sw:0,ch:[[57,60,64],[53,57,60],[50,53,57],[52,56,59]],bs:[45,41,38,40]}
};
function seqStep(n,i,t,d){const s=SONGS[n],bar=(i>>4)%4,k=i%16,c=s.ch[bar],pass=(i>>6)%2;
  if(n==='farm'){
    if(k===0||k===7||k===10)kick(t);
    if(k===4||k===12)noise(t,.14,.2,'bandpass',1800);
    if(k%2===0)noise(t,.03,k%4===2?.09:.045,'highpass',7000);
    if([0,3,6,10,13].includes(k))c.forEach(m=>syn(hz(m+12),t,d*2.2,'triangle',.05,1900,true));
    if(k===0||k===3||k===8||k===11)syn(hz(s.bs[bar]),t,d*2.6,'sine',.3,700);
    const m=s.mel[bar][k];if(m&&(pass===1||bar>=2)){syn(hz(m),t,d*2.6,'sine',.12,3200,true);syn(hz(m),t,d*1.6,'triangle',.04,2600)}
  }else{
    if(k%4===0)kick(t);
    if(k===4||k===12)noise(t,.12,.2,'bandpass',2200);
    noise(t,.02,k%4===2?.1:.04,'highpass',8000);
    if(k%4===2)syn(hz(s.bs[bar]),t,d*1.6,'sawtooth',.16,520);
    else if(k%2===0)syn(hz(s.bs[bar]-12),t,d*.9,'sawtooth',.1,320);
    syn(hz(c[[0,1,2,1][k%4]]+12*(1+(k>>3))),t,d*.9,'square',.03,2400,true);
    if(k===0)c.forEach(m=>syn(hz(m),t,d*14,'sawtooth',.028,900));
    if(k===0||k===8)syn(hz(c[2]+24-(k?1:0)),t,d*7,'sawtooth',.028,1900,true);
  }}
function playBgm(n){if(bgm.name===n)return;clearInterval(bgm.tm);bgInit();bgm.name=n;bgm.step=0;bgm.next=AC.currentTime+.08;const s=SONGS[n],d=15/s.bpm;
  bgm.tm=setInterval(()=>{if(!AC||AC.state!=='running')return;if(bgm.next<AC.currentTime)bgm.next=AC.currentTime+.05;
    while(bgm.next<AC.currentTime+.15){const i=bgm.step++;seqStep(n,i,bgm.next+(i%2?d*s.sw:0),d);bgm.next+=d}},30)}
function syncBgm(){const b=!!(Q&&Q.mode==='battle'&&!Q.over);$('#quiz').classList.toggle('danger',b);if(ac())playBgm(b?'battle':'farm')}
function sfx(k){if(!ac())return;const t=AC.currentTime,bad=k==='ng'||k==='lose';
  ({ok:[[880,0],[1109,.07],[1319,.14]],ng:[[196,0],[147,.12]],plant:[[330,0],[494,.07]],harvest:[[659,0],[880,.08],[1047,.16]],coin:[[1319,0],[1760,.07]],lv:[[523,0],[659,.1],[784,.2],[1047,.3]],win:[[523,0],[784,.12],[1047,.24],[1319,.36]],lose:[[330,0],[262,.18],[196,.36]]})[k]
  .forEach(p=>tone(p[0],t+p[1],bad?.3:.2,bad?'sawtooth':'triangle',bad?.09:.2))}
function burst(el,chars,n){try{if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=pick(chars);s.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;z-index:50;font-size:${R(18,32)}px;pointer-events:none`;document.body.appendChild(s);
    const a=Math.random()*6.28,d=R(50,140);
    s.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-40}px)) scale(1.2)`,opacity:0}],{duration:R(600,950),easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove()}}catch(e){}}

 next(){clearTimeout(Q.tm);nextQ()},
 closeQuiz,
 backStudy(){openQuiz('study')},
 fight(){nextQ()},
 scare(){S.items.kakashi--;toast('👒 かかしが害虫をおいはらった');openQuiz('study')},
 plant(i){
  const list=CROPS.filter(c=>!c.sea||c.sea===SEA);
  modal(`<h2>どのたねをまく？</h2><p class="muted">もっているコイン 🪙${fmt(S.money)}</p><div class="list">${list.map(c=>{const lock=S.lv<c.lv;
   return `<div class="row"><span class="em">${lock?'🔒':c.e}</span><div class="grow"><b>${c.n}</b>${c.sea?' <small>期間限定</small>':''}<br><small>${lock?`Lv.${c.lv}でまけるようになる`:`水${c.w}こで育つ　売ると🪙${fmt(c.sell*sellMult())}`}</small></div><button class="btn" data-a="seed" data-v="${i}:${c.id}" ${lock||S.money<c.cost?'disabled':''}>🪙${fmt(c.cost)}</button></div>`}).join('')}</div><p class="center"><button class="btn sub" data-a="closeModal">とじる</button></p>`)},
 seed(v){const [i,id]=v.split(':'),c=CROP[id];if(S.money<c.cost||S.plots[i])return;S.money-=c.cost;S.plots[i]={id,w:0,g:{math:0,kanji:0,sci:0,soc:0}};closeModal();render();const el=document.querySelectorAll('.plot')[i];if(el){el.classList.add('pop');burst(el,['🌱','✨','💧'],12)}sfx('plant')},
 info(i){const p=S.plots[i],c=CROP[p.id];
  if(S.water<1){sfx('ng');return toast('水がない。下の「水をゲット」で問題をとこう')}
  S.water--;p.w++;render();const el=document.querySelectorAll('.plot')[i];if(el){el.classList.add('pop');burst(el,['💧','💧','✨'],p.w>=c.w?16:8)}sfx(p.w>=c.w?'harvest':'plant')},
 harvest(i){
  const c=CROP[S.plots[i].id],el=document.querySelectorAll('.plot')[i],r0=el&&el.getBoundingClientRect();
  S.plots[i]=null;S.crops[c.id]=(S.crops[c.id]||0)+1;const x=addXp(c.xp);bump('harvest',1);sfx('harvest');render();
  const cnt=$('#basket b');if(r0&&cnt)cnt.textContent=stockCount()-1;
  fly(r0,$('#basket'),c.e,0,46,()=>{const b=$('#basket'),n=$('#basket b');if(n)n.textContent=stockCount();rePop(b);burst(b,['✨','⭐'],6);sfx('coin');toast(`${c.e}${c.n}をカゴに入れた　XP+${x}`)})},
 sell(){
  const v=stockValue();if(!v)return;const old=S.money,bk=$('#basket'),r0=bk&&bk.getBoundingClientRect?bk.getBoundingClientRect():null;
  S.money+=v;S.crops={};S.fish={};render();toast(`🪙${fmt(v)} で売れた`);
  const mo=$('#mo'),n=Math.min(14,5+Math.floor(Math.log10(v+1)*2));let got=0;mo.textContent=fmt(old);
  for(let k=0;k<n;k++)fly(r0,mo,'🪙',k*75,28,()=>{got++;sfx('coin');mo.textContent=fmt(old+v*got/n);rePop(mo.parentNode)})},
 buy(v){
  const n=S.plots.length,cost={plot:500*Math.pow(2,n-4),kakashi:300,net:1000,rod:1500}[v];if(S.money<cost)return;
  if(v==='plot'){if(n>=12)return;S.plots.push(null)}
  else if(v==='hiryo'){if(!planted().length)return;water();water();water()}
  else if(v==='kakashi')S.items.kakashi++;
  else{if(S.items[v])return;S.items[v]=1}
  S.money-=cost;toast('買った！');render()},
 claim(i){const m=S.ms.l[i];if(m.c||m.p<MT[m.k][1])return;m.c=true;S.tickets++;toast('🎟️ ガチャチケットを1まい受け取った');sfx('coin');burst($('#tk'),['🎟️','✨'],10);render()},
 gacha(){
  if(!S.tickets)return;S.tickets--;sfx('win');
  const c=roll(CRE.filter(c=>c.src==='gacha'||c.src===SEA)),nw=obtain(c);let ex='ずかんに登録！';
  if(!nw){const g=addCoin([0,30,100,400,1500][c.r]);ex=`もうもっているので、コイン🪙${g}にかわった。`}
  render();
  modal(`<div class="center"><p class="num" style="font-size:26px;margin:4px 0">${RAR[c.r]}</p><div class="huge">${c.e}</div><h2>${c.n}</h2><p>${ex}</p><button class="btn" data-a="closeModal">とじる</button></div>`)},
 settings(){
  modal(`<h2>せってい</h2>
  <div class="box"><b>先生用：レベルを変える</b><p class="muted">動作の確認や、進み具合の調整に使えます。</p><div class="row"><input type="number" id="setlv" min="1" max="${MAXLV}" value="${S.lv}"><button class="btn" data-a="setLv">このレベルにする</button></div></div>
  <div class="box"><b>データを最初からにする</b><p class="muted">コイン、レベル、ずかんがすべて消えます。</p><button class="btn sub" data-a="reset">最初からにする</button></div>
  <p class="muted">データはこの端末のブラウザに保存されます。別の端末には引きつがれません。</p>
  <p class="center"><button class="btn sub" data-a="closeModal">とじる</button></p>`)},
 setLv(){const v=Math.max(1,Math.min(MAXLV,parseInt($('#setlv').value)||1));S.lv=v;S.xp=0;closeModal();render();toast(`Lv.${v} にした`)},
 reset(){modal(`<h2>本当に最初からにする？</h2><p>もとにもどせません。</p><p><button class="btn" data-a="resetYes">最初からにする</button> <button class="btn sub" data-a="closeModal">やめる</button></p>`)},
 resetYes(){S=def();norm();closeModal();render()},
 mute(){S.mute=!S.mute;if(master)master.gain.value=S.mute?0:1;render()},
 unlock(v){const a=AREAS.find(x=>x.id===v);if(!a||isOpen(a)||S.lv<a.lv||S.money<a.cost)return;S.money-=a.cost;S.open[v]=1;sfx('win');render();burst($('#lv'),['🎉','🎊','⭐',a.e],22);toast(`🎉 ${a.e}「${a.n}」を開放した！`)},
 closeModal
};
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
document.addEventListener('click',e=>{
  if(ac()&&!bgm.name)syncBgm();
  if(e.target.id==='modal')return closeModal();
  const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
render();
</script>
</body>
</html>
